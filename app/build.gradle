apply plugin: 'com.android.application'

android {
    //todo update2.6.4 升级到api35需要将namespace写入gradle文件，同理删除位于AndroidManifest.xml文件的对应内容
    namespace 'com.immortaltaoists.en'
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.immortaltaoists.en"
        minSdkVersion 26
        //noinspection EditedTargetSdkVersion
        targetSdkVersion 35
        versionCode 49
        versionName "1.4.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../assets', 'src/main/assets', 'src/main/assets/']
            jniLibs.srcDirs = ['libs']
        }
    }

    //指定jdk版本
    compileOptions {
        //ToDo update2.6.4 建议升级指定jdk版本
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

buildscript {

    repositories {
        google()
//        jcenter()
        mavenCentral()
        maven {
            url 'https://maven.aliyun.com/repository/public/'
        }
        maven {
            url 'https://maven.aliyun.com/repository/jcenter/'
        }


        maven {
            url 'https://android-sdk.is.com/'
        }

    }
    dependencies {
        //ToDo update2.6.4 请根据开发IDE的版本选择符合API35的gradle插件版本
        classpath 'com.android.tools.build:gradle:8.5.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // ToDo update2.6.4 添加TradPlus和其他广告网络所需的仓库
        maven { url "https://applovin.bintray.com/Android-Adapter-SDKs" }
        maven { url 'https://artifact.bytedance.com/repository/pangle/' }
        // Pangle
        maven {
            url 'https://artifact.bytedance.com/repository/pangle'
        }
        // Mintegral
        //Launch GP market application， Android X Version
        //If you fail to pull the code using gradle, add the maven warehouse configuration to the project root build.gradle file
        maven {
            url  "https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea"
        }
//        jcenter()
    }
}

